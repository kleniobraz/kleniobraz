<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 20 1280 300" role="img" aria-label="Klenio Braz · Audiovisual producer who builds the tools">
  <style>
    .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .clip{fill:#1E1E1E;animation:lit 6s linear infinite}
    @keyframes lit{0%{fill:#7FD96B}35%{fill:#7FD96B}60%,100%{fill:#1E1E1E}}
    .ph{animation:sweep 6s linear infinite}
    @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(560px)}}
    .dot{animation:flow 3s linear infinite}
    @keyframes flow{from{transform:translateX(0)}to{transform:translateX(500px)}}
    .node{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke:#2a2a2a}50%{stroke:#7FD96B}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect y="0" width="1280" height="340" fill="#0A0A0A"/>
  <g stroke="#161616" stroke-width="1">
    <path d="M0 68H1280M0 272H1280"/>
  </g>

  <!-- identity -->
  <text x="64" y="122" class="sans" font-size="54" font-weight="700" fill="#FFFFFF">Klenio Braz<tspan fill="#7FD96B">.</tspan></text>
  <text x="66" y="164" class="sans" font-size="22" fill="#AAAAAA">Audiovisual producer who builds the tools.</text>
  <text x="66" y="204" class="mono" font-size="15" fill="#7FD96B">&gt; AI systems for video, automation and creative workflows<tspan class="cur">_</tspan></text>
  <text x="66" y="248" class="mono" font-size="12" fill="#555">NATAL, BR · GRUPO SB</text>

  <!-- timeline: editing tracks -->
  <g transform="translate(660 92)">
    <text x="0" y="-8" class="mono" font-size="11" fill="#555">timeline</text>
    <g>
      <text x="0" y="17" class="mono" font-size="11" fill="#444">V1</text>
      <rect x="28" y="4"  width="120" height="18" rx="3" class="clip" style="animation-delay:0.00s"/>
      <rect x="154" y="4" width="70"  height="18" rx="3" class="clip" style="animation-delay:1.35s"/>
      <rect x="230" y="4" width="150" height="18" rx="3" class="clip" style="animation-delay:2.16s"/>
      <rect x="386" y="4" width="90"  height="18" rx="3" class="clip" style="animation-delay:3.84s"/>
      <rect x="482" y="4" width="106" height="18" rx="3" class="clip" style="animation-delay:4.86s"/>

      <text x="0" y="45" class="mono" font-size="11" fill="#444">A1</text>
      <rect x="28" y="32"  width="200" height="18" rx="3" class="clip" style="animation-delay:0.00s"/>
      <rect x="234" y="32" width="120" height="18" rx="3" class="clip" style="animation-delay:2.21s"/>
      <rect x="360" y="32" width="228" height="18" rx="3" class="clip" style="animation-delay:3.56s"/>

      <text x="0" y="73" class="mono" font-size="11" fill="#444">CC</text>
      <rect x="28" y="60"  width="40" height="18" rx="3" class="clip" style="animation-delay:0.00s"/>
      <rect x="74" y="60"  width="56" height="18" rx="3" class="clip" style="animation-delay:0.49s"/>
      <rect x="136" y="60" width="34" height="18" rx="3" class="clip" style="animation-delay:1.16s"/>
      <rect x="176" y="60" width="62" height="18" rx="3" class="clip" style="animation-delay:1.59s"/>
      <rect x="244" y="60" width="44" height="18" rx="3" class="clip" style="animation-delay:2.31s"/>
      <rect x="294" y="60" width="70" height="18" rx="3" class="clip" style="animation-delay:2.85s"/>
      <rect x="370" y="60" width="38" height="18" rx="3" class="clip" style="animation-delay:3.66s"/>
      <rect x="414" y="60" width="60" height="18" rx="3" class="clip" style="animation-delay:4.14s"/>
      <rect x="480" y="60" width="48" height="18" rx="3" class="clip" style="animation-delay:4.84s"/>
      <rect x="534" y="60" width="54" height="18" rx="3" class="clip" style="animation-delay:5.42s"/>
    </g>
    <g class="ph">
      <path d="M28 -4V86" stroke="#7FD96B" stroke-width="2"/>
      <path d="M22 -6h12l-6 7z" fill="#7FD96B"/>
    </g>
  </g>

  <!-- pipeline -->
  <g transform="translate(688 222)">
        <g class="mono" font-size="12" text-anchor="middle">
      <rect x="-28" y="0" width="120" height="32" rx="16" fill="#0A0A0A" stroke-width="1.5" class="node" style="animation-delay:0s"/>
      <text x="32" y="21" fill="#FFFFFF">transcribe</text>
      <rect x="112" y="0" width="100" height="32" rx="16" fill="#0A0A0A" stroke-width="1.5" class="node" style="animation-delay:0.75s"/>
      <text x="162" y="21" fill="#FFFFFF">score</text>
      <rect x="232" y="0" width="110" height="32" rx="16" fill="#0A0A0A" stroke-width="1.5" class="node" style="animation-delay:1.5s"/>
      <text x="287" y="21" fill="#FFFFFF">reframe</text>
      <rect x="362" y="0" width="110" height="32" rx="16" fill="#7FD96B" stroke="#7FD96B" stroke-width="1.5"/>
      <text x="417" y="21" fill="#0A0A0A" font-weight="700">ship 9:16</text>
    </g>
    <path d="M-28 50H472" stroke="#1E1E1E" stroke-width="2"/>
    <circle cx="-28" cy="50" r="3.5" fill="#7FD96B" class="dot"/>
  </g>
</svg>
